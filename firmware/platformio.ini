; PlatformIO configuration for SailinGrace-esp32.
;
; Default target: Adafruit ESP32-S3 Feather (recommended in PLAN.md).
; Swap [env] to the board you actually have.

[platformio]
default_envs = adafruit_feather_esp32s3

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    gilmaimon/ArduinoWebsockets@^0.5.4
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Alternative: bare ESP32 DevKit (cheaper but less integrated)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    gilmaimon/ArduinoWebsockets@^0.5.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
