; PlatformIO configuration for SailinGrace-esp32.
;
; Default target: Adafruit Feather HUZZAH32 (original ESP32 Feather) — the
; board on hand: micro-USB, CP2104 bridge (/dev/ttyUSB0), 4 MB flash, LED on
; GPIO 13. Swap default_envs to the [env] matching your board.

[platformio]
default_envs = featheresp32

; Logging-only / TCP NMEA path (Phase 0 locked) uses only built-in WiFi/SD/SPI
; + RTClib. ArduinoJson + ArduinoWebsockets were for the SignalK-WS path, which
; Lynx doesn't use — keep them out so the binary stays lean. Re-add if this rig
; is ever reused on a SignalK boat.

; ── Adafruit Feather HUZZAH32 (original ESP32) — the board we have ──
[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800        ; CP2104 is reliable here; bump to 921600 if stable
lib_deps =
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ── Adafruit ESP32-S3 Feather (USB-C, native USB) — originally-specced board ──
[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Alternative: bare ESP32 DevKit (cheaper but less integrated; no onboard RTC —
; timestamps come from GPS-in-stream post-trip).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
