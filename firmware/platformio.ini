; PlatformIO configuration for SailinGrace-esp32.
;
; Default target: ELEGOO / DOIT ESP32 DevKit V1 (ESP32-WROOM-32) + a wired
; microSD SPI module. micro-USB, CP2102 bridge (/dev/ttyUSB0), LED on GPIO 2,
; NO onboard RTC (timestamps come from GPS-in-stream). Swap default_envs to
; the [env] matching your board.
;
; microSD module wiring (VSPI):  SCK->18  MISO->19  MOSI->23  CS->5
;   VCC->5V (modules with an onboard regulator) or 3V3 (bare 3.3V breakouts)
;   GND->GND.  CS pin = SD_CS (5 by default in config.h).

[platformio]
default_envs = esp32doit-devkit-v1

; Logging-only / TCP NMEA path (Phase 0 locked) uses only built-in WiFi/SD/SPI
; + RTClib. ArduinoJson + ArduinoWebsockets were for the SignalK-WS path, which
; Lynx doesn't use — keep them out so the binary stays lean. Re-add if this rig
; is ever reused on a SignalK boat.

; ── ELEGOO / DOIT ESP32 DevKit V1 + wired microSD module — current board ──
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600        ; CP2102; drop to 460800 if uploads are flaky
lib_deps =
    adafruit/RTClib@^2.1.4    ; harmless with no RTC chip (begin() just returns false)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; SD_CS defaults to 5 (config.h)

; ── Adafruit Feather HUZZAH32 + Adalogger FeatherWing (race-verified) ──
[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800        ; CP2104 is reliable here; bump to 921600 if stable
lib_deps =
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSD_CS=33               ; Adalogger SD CS on the ESP32 Feather

; ── Adafruit ESP32-S3 Feather + Adalogger (USB-C; originally-specced) ──
[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/RTClib@^2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSD_CS=33               ; Adalogger SD CS on the S3 Feather
