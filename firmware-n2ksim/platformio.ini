; SailinGrace N2K bench sensor simulator — separate from the WiFi logger in
; ../firmware so the race firmware stays untouched. Sends the scripted
; 120 s sensor profile from SailinGrace-pi/docs/bench_test.md onto an
; NMEA 2000 backbone via the ESP32's built-in CAN controller (TWAI) and a
; 3.3 V transceiver (CAN Pal / SN65HVD230).
;
; BENCH ONLY. Never connect this to a boat bus with live instruments or an
; autopilot — it transmits fake heading and wind.

[platformio]
default_envs = featheresp32

[env]
; Pinned to the 6.x platform (Arduino-ESP32 core 2.0.x): NMEA2000_esp32 uses
; ROM GPIO-matrix calls that core 3.x (ESP-IDF 5) removed. Library versions are
; pinned to what was build-verified.
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    ttlappalainen/NMEA2000-library@4.25.1
    ttlappalainen/NMEA2000_esp32@1.0.3

; Adafruit Feather HUZZAH32 (original ESP32) — the board on hand.
[env:featheresp32]
board = featheresp32
upload_speed = 460800

; Bare ESP32 DevKit.
[env:esp32dev]
board = esp32dev
